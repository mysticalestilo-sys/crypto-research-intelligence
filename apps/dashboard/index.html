<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crypto Research Intelligence</title><style>body{font-family:Inter,system-ui,sans-serif;margin:0;background:#0b1020;color:#eef2ff}main{max-width:1400px;margin:auto;padding:28px}h1{margin-bottom:4px}.muted{color:#94a3b8}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.card{background:#121a2e;border:1px solid #26324d;border-radius:14px;padding:18px}.score{font-size:32px;font-weight:800}table{width:100%;border-collapse:collapse;background:#121a2e;border-radius:14px;overflow:hidden}th,td{padding:13px;text-align:left;border-bottom:1px solid #26324d}th{color:#94a3b8;font-size:12px;text-transform:uppercase}.pill{padding:5px 9px;border-radius:999px;background:#23304a}.buy{color:#7dd3a7}.watch{color:#facc15}</style></head><body><main><h1>Crypto Research Intelligence</h1><div class="muted">22-Point Command Center · research mode</div><div class="grid"><div class="card"><div class="muted">Market Regime</div><div class="score">NEUTRAL</div></div><div class="card"><div class="muted">BTC 22P</div><div class="score">—</div></div><div class="card"><div class="muted">ETH 22P</div><div class="score">—</div></div><div class="card"><div class="muted">Data Freshness</div><div class="score">—</div></div></div><table><thead><tr><th>Asset</th><th>22P Score</th><th>Regime</th><th>Derivatives</th><th>Whale</th><th>Fundamental</th><th>Technical</th><th>Action</th></tr></thead><tbody id="rows"><tr><td colspan="9">Loading live market data…</td></tr></tbody></table></main><script>const symbols=["BTCUSDT","ETHUSDT","SOLUSDT","BNBUSDT","XRPUSDT","DOGEUSDT"];async function load(){try{const xs=await Promise.all(symbols.map(s=>fetch("https://api.binance.com/api/v3/ticker/24hr?symbol="+s).then(r=>r.json())));const fmt=x=>Number(x).toLocaleString(undefined,{maximumFractionDigits:4});document.getElementById("btc").textContent="$"+fmt(xs[0].lastPrice);document.getElementById("eth").textContent="$"+fmt(xs[1].lastPrice);document.getElementById("rows").innerHTML=xs.map(x=>{const ch=Number(x.priceChangePercent);return '<tr><td><b>'+x.symbol.replace("USDT","")+'</b></td><td></body></html>+fmt(x.lastPrice)+'</td><td class="'+(ch>=0?"green":"red")+'">'+ch.toFixed(2)+'%</td><td>—</td><td><span class="pill">NEUTRAL</span></td><td>—</td><td>—</td><td>—</td><td><span class="pill">DATA READY</span></td></tr>'}).join("");document.getElementById("updated").textContent="Updated "+new Date().toLocaleTimeString();}catch(e){document.getElementById("rows").innerHTML='<tr><td colspan="9" class="red">Live data unavailable. Refresh to retry.</td></tr>'}}load();setInterval(load,60000);</script></body></html>
