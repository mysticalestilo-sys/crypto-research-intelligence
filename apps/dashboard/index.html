<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crypto Research Intelligence</title><style>body{font-family:Inter,system-ui,sans-serif;margin:0;background:#0b1020;color:#eef2ff}main{max-width:1400px;margin:auto;padding:28px}h1{margin-bottom:4px}.muted{color:#94a3b8}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.card{background:#121a2e;border:1px solid #26324d;border-radius:14px;padding:18px}.score{font-size:32px;font-weight:800}table{width:100%;border-collapse:collapse;background:#121a2e;border-radius:14px;overflow:hidden}th,td{padding:13px;text-align:left;border-bottom:1px solid #26324d}th{color:#94a3b8;font-size:12px;text-transform:uppercase}.pill{padding:5px 9px;border-radius:999px;background:#23304a}.buy{color:#7dd3a7}.watch{color:#facc15}</style></head><body><main><h1>Crypto Research Intelligence</h1><div class="muted">22-Point Command Center · research mode</div><div class="grid"><div class="card"><div class="muted">Market Regime</div><div class="score">NEUTRAL</div></div><div class="card"><div class="muted">BTC 22P</div><div class="score">—</div></div><div class="card"><div class="muted">ETH 22P</div><div class="score">—</div></div><div class="card"><div class="muted">Data Freshness</div><div class="score">—</div></div></div><table><thead><tr><th>Asset</th><th>22P Score</th><th>Regime</th><th>Derivatives</th><th>Whale</th><th>Fundamental</th><th>Technical</th><th>Action</th></tr></thead><tbody id="rows"><tr><td>BTC</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td><span class="pill">WAITING FOR DATA</span></td></tr></tbody></table></main><script>fetch('/api/framework/demo').then(r=>r.json()).then(x=>{document.querySelector('.score').textContent=x.scorePct+'%';document.querySelector('#rows').innerHTML='<tr><td>'+x.asset+'</td><td>'+x.scorePct+'%</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td><span class="pill">'+x.action+'</span></td></tr>'}).catch(()=>{});</script></body></html>
